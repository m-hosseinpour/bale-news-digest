name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy VM
        run: |
          # ساخت کلید SSH موقت
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # اجرای دستورات روی سرور مقصد
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd "${{ secrets.APP_DIR }}"

          git fetch origin main
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date with origin/main ($LOCAL). Skipping deploy."
            exit 0
          fi
          echo "Deploying $LOCAL -> $REMOTE"
          git reset --hard origin/main

          uv sync

          # سرویس‌ها سطح کاربرند، پس دیگر sudo لازم نیست. یک شل غیرتعاملی SSH خودش
          # XDG_RUNTIME_DIR ندارد و بدون آن systemctl --user با
          # «Failed to connect to bus: No medium found» شکست می‌خورد.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"

          # یونیت‌های نسخه‌بندی‌شدهٔ ریپو روی ماشین نصب می‌شوند تا یونیت مستقر از
          # یونیتِ کامیت‌شده جدا نیفتد.
          mkdir -p ~/.config/systemd/user
          cp deploy/user/bale-news-digest.service \
             deploy/user/bale-news-digest.timer \
             deploy/user/news-bot-webhook.service \
             ~/.config/systemd/user/
          systemctl --user daemon-reload

          # enable برای زنده‌ماندن بعد از ریبوت لازم است و اگر از قبل فعال باشد بی‌اثر است.
          systemctl --user enable bale-news-digest.timer news-bot-webhook.service

          systemctl --user restart news-bot-webhook.service
          sleep 2
          systemctl --user status news-bot-webhook.service --no-pager
          EOF
          
          # پاک‌سازی کلید
          rm ~/.ssh/deploy_key
