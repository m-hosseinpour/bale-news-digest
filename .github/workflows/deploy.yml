name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy VM
        run: |
          # ساخت کلید SSH موقت
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # اجرای دستورات روی سرور مقصد
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd "${{ secrets.APP_DIR }}"

          git fetch origin main
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/main)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date with origin/main ($LOCAL). Skipping deploy."
            exit 0
          fi
          echo "Deploying $LOCAL -> $REMOTE"
          git reset --hard origin/main

          uv sync

          sudo systemctl restart news-bot-webhook.service
          sleep 2
          sudo systemctl status news-bot-webhook.service --no-pager
          EOF
          
          # پاک‌سازی کلید
          rm ~/.ssh/deploy_key
